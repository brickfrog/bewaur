[package]
name = "bewaur"
version = "0.4.1"
edition = "2024"
description = "Pre-install risk and trust scoring for AUR packages"
license = "MIT"

[[bin]]
name = "bewaur"
path = "src/main.rs"

[[bin]]
name = "bewaur-hook"
path = "hook/bewaur-hook.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
colored = "2"
strsim = "0.11"
rayon = "1.10"
flate2 = "1.0"
indicatif = "0.17"
sha2 = "0.10"
fs2 = "0.4"
bzip2 = "0.6"
liblzma = "0.4"
zstd = "0.13"
tar = "=0.4.46"
libc = "0.2"
